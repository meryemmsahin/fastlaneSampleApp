---
name: iOS CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - "release/*"
      - main
  pull_request:
    branches:
      - develop

jobs:
  tests:
    name: Run Unit Tests
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Print Current Directory
        run: |
          echo "Current Directory:" && pwd
          echo "Listing files:" && ls -la
          echo "Searching for .xcodeproj files:"
          find . -name '*.xcodeproj'

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s \
            /Applications/Xcode_16.2.app/Contents/Developer

      - name: Ensure iOS 17.2 Simulator is Installed
        run: |
          sudo xcodebuild -runFirstLaunch
          sudo xcodebuild -downloadPlatform iOS ||
            echo "iOS Platform already installed"
          sudo xcrun simctl create "iPhone 15" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-15 \
            com.apple.CoreSimulator.SimRuntime.iOS-17-2 ||
            echo "Simulator already exists"

      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.0

      - name: Install Fastlane Dependencies
        run: |
          [ -f Gemfile ] && bundle install || gem install fastlane

      - name: List Available Simulators
        run: xcrun simctl list devices available

      - name: Boot iPhone 15 (iOS 17.2) Simulator
        run: |
          UDID=$(xcrun simctl list devices available | awk \
            '/iPhone 15 \(/ && /17.2/ {print $NF}' | tr -d '()')
          if [ -z "$UDID" ]; then
            echo "❌ Simulator not found!" && exit 1
          fi
          echo "✅ Found Simulator: $UDID"
          xcrun simctl boot "$UDID"
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV

      - name: Run Unit Tests on iPhone 15 (iOS 17.2)
        run: fastlane ci_tests
        env:
          SIMULATOR_UDID: ${{ env.SIMULATOR_UDID }}

  deploy-firebase:
    name: Deploy to Firebase (Develop)
    runs-on: macos-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s \
            /Applications/Xcode_16.2.app/Contents/Developer

      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.0

      - name: Install Fastlane Dependencies
        run: |
          [ -f Gemfile ] && bundle install || gem install fastlane

      - name: Deploy to Firebase App Distribution
        run: fastlane deploy_to_firebase
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          FIREBASE_GROUPS: ${{ secrets.FIREBASE_GROUPS }}
          FIREBASE_APP_DISTRIBUTION_CLI_TOKEN: |
            ${{ secrets.FIREBASE_APP_DISTRIBUTION_CLI_TOKEN }}

  deploy-testflight:
    name: Deploy to TestFlight (Main & Release)
    runs-on: macos-latest
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s \
            /Applications/Xcode_16.2.app/Contents/Developer

      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.0

      - name: Install Fastlane Dependencies
        run: |
          [ -f Gemfile ] && bundle install || gem install fastlane

      - name: Decode App Store API Key
        run: |
          echo "${{ secrets.APP_STORE_API_KEY }}" |
          base64 --decode > AuthKey.p8

      - name: Deploy to TestFlight
        run: fastlane deploy_to_testflight
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_API_KEY: AuthKey.p8
